<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Matome Mbowene</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      margin: 0; background: #ffffff; color: #374151;
      font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    main { text-align: center; padding: 24px; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #6b7280; }
    h1 { font-size: 24px; color: #111827; margin: 12px 0 8px; }
    p { margin: 0 0 20px; }
    a { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 / not-found</p>
    <h1>This page doesn&rsquo;t exist here anymore.</h1>
    <p>The site was rebuilt in 2026; taking you to the current version&hellip;</p>
    <p><a id="home-link" href="/">matomembowene.co.za</a></p>
  </main>
  <script>
    // Redirect legacy (pre-rebuild) URLs to their hash-routed equivalents,
    // then fall back to the home page for anything unrecognised.
    (function () {
      var legacy = {
        "/case-studies/ocr-document-automation.html": "/#/project/ocr-document-automation",
        "/case-studies/rag-assistant.html": "/#/project/rag-assistant",
        "/blog/validation-first-ocr.html": "/#/writing",
        "/blog/rag-guardrails.html": "/#/writing",
        "/blog/shipping-discipline.html": "/#/writing",
        "/blog": "/#/writing",
        "/case-studies": "/#/projects",
        "/projects": "/#/projects",
        "/experience": "/#/experience",
        "/architecture": "/#/architecture",
        "/writing": "/#/writing",
        "/resume": "/#/resume",
        "/contact": "/#/contact"
      };
      var path = window.location.pathname.replace(/\/+$/, "") || "/";
      var target = legacy[path] || legacy[path + ".html"] || "/";
      var home = document.getElementById("home-link");
      if (home) home.setAttribute("href", target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
